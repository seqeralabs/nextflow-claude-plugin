[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nflint"
version = "0.1.0"
description = "Structural linter for the design-nextflow-pipelines skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "design-nextflow-pipelines" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
nflint = "nflint.cli:main"

[tool.setuptools.packages.find]
include = ["nflint*"]
exclude = ["example_pipeline*"]
