name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so validation results are reproducible; bump deliberately.
  CLAUDE_CODE_VERSION: "2.1.295"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Test skill consolidation
        run: python3 -I tools/test_consolidate_skills.py

      - name: Test skill pack generation and plugin boundaries
        run: python3 -I tools/test_skill_packs.py

      - name: Check provenance hashes and manifest versions
        run: python3 -I tools/check_sources.py

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Validate optional plugin manifests
        run: |
          for pack in packs/*; do
            claude plugin validate --strict "$pack/.claude-plugin/plugin.json"
          done

      - name: Verify isolated core and optional-pack installations
        run: python3 -I tools/verify_skill_packs.py --report "${{ runner.temp }}/pack-installations.json"
