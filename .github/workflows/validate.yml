name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so validation results are reproducible; bump deliberately.
  CLAUDE_CODE_VERSION: "2.1.267"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Check provenance hashes and manifest versions
        run: python3 -I tools/check_sources.py

      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Validate skills
        run: claude plugin validate --strict skills

      - name: Install from the local marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          claude plugin marketplace add ./
          claude plugin install nextflow@nextflow-claude-plugin
          claude plugin details nextflow@nextflow-claude-plugin | tee details.txt
          expected=$(ls skills | wc -l)
          grep -q "Skills (${expected})" details.txt
          grep -q "MCP servers (1)  seqera" details.txt
